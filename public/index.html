<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Compras · CORA</title>
<style>
  :root{
    --bg:#faf7f2;
    --surface:#ffffff;
    --surface-2:#f1ece3;
    --ink:#2b2620;
    --ink-dim:#6f665a;
    --line:#e3dccf;
    --accent:#b5522a;
    --accent-ink:#ffffff;
    --good:#3f7d5c;
    --good-bg:#e6f0ea;
    --bad:#b5522a;
    --bad-bg:#f6e6e0;
    --font-display:'Fraunces',ui-serif,Georgia,serif;
    --font-body:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1814; --surface:#252019; --surface-2:#2e2820; --ink:#f1ebe0; --ink-dim:#b3a996;
      --line:#3c352a; --accent:#e07a4c; --accent-ink:#1c1814; --good:#7fc79f; --good-bg:#233229;
      --bad:#e5876a; --bad-bg:#3a2620; color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0;padding-inline:20px;padding-block:16px;max-width:1180px;margin-inline:auto}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  header.top{position:sticky;top:0;background:var(--bg);z-index:5;padding-block:10px 14px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .brand h1{font-size:1.5rem;letter-spacing:.2px}
  .brand .tag{color:var(--ink-dim);font-size:.85rem}
  .status{font-size:.78rem;color:var(--ink-dim)}
  .status.err{color:var(--bad)}
  .status.ok{color:var(--good)}

  .filters{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .filter-group{display:flex;flex-direction:column;gap:6px;min-width:0}
  .filter-group label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.8rem;cursor:pointer;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .search{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:.85rem;min-width:180px}
  .date-range{display:flex;gap:8px;align-items:center}
  .date-range input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--font-mono);font-size:.8rem}
  .date-range span{color:var(--ink-dim);font-size:.8rem}

  section{margin-block:22px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
  .kpi .v{font-family:var(--font-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:.72rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h2{font-size:1.1rem;margin-bottom:12px}

  .bar-row{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;padding-block:6px}
  .bar-row .prov{font-size:.85rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{background:var(--surface-2);border-radius:6px;height:16px;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px}
  .bar-row .amt{font-size:.82rem;white-space:nowrap}

  table{width:100%;border-collapse:collapse;font-size:.85rem}
  thead th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);border-bottom:1px solid var(--line);padding:8px 8px;cursor:pointer;white-space:nowrap}
  thead th.active{color:var(--accent)}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr.prod{cursor:pointer}
  tbody tr.prod:hover{background:var(--surface-2)}
  .tablewrap{overflow-x:auto}
  td.num,th.num{text-align:right}

  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:600}
  .pill.up{background:var(--bad-bg);color:var(--bad)}
  .pill.down{background:var(--good-bg);color:var(--good)}
  .pill.flat{background:var(--surface-2);color:var(--ink-dim)}
  .pill.big{outline:1.5px solid currentColor}

  .detail{background:var(--surface-2)}
  .detail td{padding:14px 16px}
  .hist{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .hist svg{background:var(--surface);border-radius:8px;border:1px solid var(--line)}
  .hist-list{font-size:.8rem;border-collapse:collapse}
  .hist-list td{padding:3px 10px 3px 0;border:none}

  .empty{color:var(--ink-dim);font-size:.9rem;padding:20px;text-align:center}
  footer{color:var(--ink-dim);font-size:.75rem;text-align:center;padding-block:24px 8px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Control de Compras</h1>
    <span class="tag">CORA by Luli Catering</span>
    <span id="status" class="status"></span>
  </div>

  <div class="filters" id="filters" hidden>
    <div class="filter-group">
      <label>Período</label>
      <div class="chips" id="rangeChips">
        <span class="chip on" data-range="all">Todo</span>
        <span class="chip" data-range="30">Últimos 30 días</span>
        <span class="chip" data-range="90">Últimos 90 días</span>
        <span class="chip" data-range="month">Este mes</span>
      </div>
    </div>
    <div class="filter-group">
      <label>Rango de fechas</label>
      <div class="date-range">
        <input type="date" id="dateFrom">
        <span>a</span>
        <input type="date" id="dateTo">
      </div>
    </div>
    <div class="filter-group">
      <label>Proveedores</label>
      <div class="chips" id="provChips"></div>
    </div>
    <div class="filter-group">
      <label>Buscar insumo</label>
      <input type="text" class="search" id="searchInput" placeholder="ej: pollo, papel...">
    </div>
  </div>
</header>

<div id="app">
  <div class="empty" id="emptyMsg">Cargando datos de compras...</div>
</div>

<footer id="footerNote" hidden></footer>

<script>
(function(){
  "use strict";

  // Misma origin que la función: no hace falta pedir URL, se pide con ruta relativa.
  var DATA_URL = "/.netlify/functions/dashboard-data";

  var state = { compras: [], generado: null, range: "all", customFrom: "", customTo: "", provs: null, search: "", sortKey: "gasto", sortDir: "desc", openKey: null };

  var $ = function(sel, root){ return (root||document).querySelector(sel); };
  var $all = function(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); };

  var fmtMoney = new Intl.NumberFormat("es-AR", { style:"currency", currency:"ARS", maximumFractionDigits:0 });
  var fmtNum = new Intl.NumberFormat("es-AR", { maximumFractionDigits:2 });
  var fmtPct = function(v){ return (v>0?"+":"") + fmtNum.format(v) + "%"; };
  var fmtDate = function(s){
    if(!s) return "—";
    var d = new Date(s.length===10 ? s+"T00:00:00" : s);
    if(isNaN(d)) return s;
    return d.toLocaleDateString("es-AR", { day:"2-digit", month:"2-digit", year:"2-digit" });
  };

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function setStatus(msg, cls){
    var el = $("#status");
    el.textContent = msg;
    el.className = "status" + (cls ? " "+cls : "");
  }

  function load(){
    setStatus("Cargando...", "");
    fetch(DATA_URL)
      .then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data){
        if(data.error) throw new Error(data.error);
        state.compras = data.compras || [];
        state.generado = data.generado;
        setStatus(state.compras.length + " líneas de compra cargadas.", "ok");
        $("#filters").hidden = false;
        buildProviderChips();
        render();
      })
      .catch(function(err){
        setStatus("No se pudo cargar: " + err.message, "err");
        $("#app").innerHTML = '<div class="empty">No se pudieron cargar los datos. Probá recargar la página en un minuto.</div>';
      });
  }

  load();

  // ---------- Filtros ----------

  $("#rangeChips").addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(!chip) return;
    $all(".chip", $("#rangeChips")).forEach(function(c){ c.classList.remove("on"); });
    chip.classList.add("on");
    state.range = chip.getAttribute("data-range");
    state.customFrom = ""; state.customTo = "";
    $("#dateFrom").value = ""; $("#dateTo").value = "";
    render();
  });

  $("#dateFrom").addEventListener("change", function(e){
    state.customFrom = e.target.value;
    if(state.customFrom || state.customTo){
      $all(".chip", $("#rangeChips")).forEach(function(c){ c.classList.remove("on"); });
    }
    render();
  });
  $("#dateTo").addEventListener("change", function(e){
    state.customTo = e.target.value;
    if(state.customFrom || state.customTo){
      $all(".chip", $("#rangeChips")).forEach(function(c){ c.classList.remove("on"); });
    }
    render();
  });

  $("#searchInput").addEventListener("input", function(e){
    state.search = e.target.value.trim().toLowerCase();
    render();
  });

  function buildProviderChips(){
    var provs = Array.from(new Set(state.compras.map(function(c){ return c.proveedor; }))).filter(Boolean).sort();
    state.provs = null; // null = todos
    var box = $("#provChips");
    box.innerHTML = "";
    provs.forEach(function(p){
      var chip = document.createElement("span");
      chip.className = "chip on";
      chip.textContent = p;
      chip.setAttribute("data-prov", p);
      box.appendChild(chip);
    });
    box.addEventListener("click", function(e){
      var chip = e.target.closest(".chip");
      if(!chip) return;
      chip.classList.toggle("on");
      var active = $all(".chip.on", box).map(function(c){ return c.getAttribute("data-prov"); });
      state.provs = (active.length === provs.length) ? null : active;
      render();
    });
  }

  function rangeStart(){
    if(state.customFrom) return new Date(state.customFrom+"T00:00:00");
    var now = new Date();
    if(state.range === "30"){ var d=new Date(now); d.setDate(d.getDate()-30); return d; }
    if(state.range === "90"){ var d2=new Date(now); d2.setDate(d2.getDate()-90); return d2; }
    if(state.range === "month"){ return new Date(now.getFullYear(), now.getMonth(), 1); }
    return null;
  }

  function rangeEnd(){
    if(state.customTo) return new Date(state.customTo+"T23:59:59");
    return null;
  }

  function filtered(){
    var start = rangeStart();
    var end = rangeEnd();
    return state.compras.filter(function(c){
      if(!c.fecha || c.total==null) return false;
      if(state.provs && state.provs.indexOf(c.proveedor) === -1) return false;
      if(start || end){
        var d = new Date(c.fecha.length===10 ? c.fecha+"T00:00:00" : c.fecha);
        if(isNaN(d)) return false;
        if(start && d < start) return false;
        if(end && d > end) return false;
      }
      if(state.search && !(String(c.descripcion||"").toLowerCase().indexOf(state.search) > -1)) return false;
      return true;
    });
  }

  // ---------- Agregaciones ----------

  function byProveedor(rows){
    var map = {};
    rows.forEach(function(c){
      var k = c.proveedor || "(sin proveedor)";
      map[k] = (map[k]||0) + (c.total||0);
    });
    return Object.keys(map).map(function(k){ return { proveedor:k, gasto:map[k] }; })
      .sort(function(a,b){ return b.gasto - a.gasto; });
  }

  function byProducto(rows){
    var map = {};
    rows.forEach(function(c){
      var key = (c.proveedor||"?") + "||" + (c.descripcion||"?");
      if(!map[key]){
        map[key] = { key:key, proveedor:c.proveedor, descripcion:c.descripcion, gasto:0, cantidad:0, unidades:{}, compras:[] };
      }
      var g = map[key];
      g.gasto += (c.total||0);
      g.cantidad += (c.cantidad_comprada||0);
      var u = c.unidad_compra || "u.";
      g.unidades[u] = (g.unidades[u]||0) + 1;
      g.compras.push(c);
    });
    return Object.keys(map).map(function(k){
      var g = map[k];
      g.compras.sort(function(a,b){ return (a.fecha||"").localeCompare(b.fecha||""); });
      var last = g.compras[g.compras.length-1];
      var prev = g.compras.length>1 ? g.compras[g.compras.length-2] : null;
      g.ultimoPrecio = last ? last.precio_unitario : null;
      g.ultimaFecha = last ? last.fecha : null;
      g.precioAnterior = prev ? prev.precio_unitario : null;
      g.fechaAnterior = prev ? prev.fecha : null;
      g.variacion = (prev && prev.precio_unitario) ? ((g.ultimoPrecio - prev.precio_unitario) / prev.precio_unitario * 100) : null;
      var mejorUnidad = "u.", max=0;
      Object.keys(g.unidades).forEach(function(u){ if(g.unidades[u]>max){ max=g.unidades[u]; mejorUnidad=u; } });
      g.unidad = mejorUnidad;
      g.numCompras = g.compras.length;
      return g;
    });
  }

  // ---------- Render ----------

  function render(){
    if(!state.compras.length){
      $("#app").innerHTML = '<div class="empty">Todavía no hay compras cargadas en Firestore.</div>';
      return;
    }
    var rows = filtered();
    var app = $("#app");
    if(!rows.length){
      app.innerHTML = '<div class="empty">No hay compras para este filtro.</div>';
      return;
    }

    var totalGasto = rows.reduce(function(s,c){ return s + (c.total||0); }, 0);
    var provAgg = byProveedor(rows);
    var prodAgg = byProducto(rows);
    var numFacturas = new Set(rows.map(function(c){ return c.proveedor+"|"+c.comprobante_nro; })).size;
    var maxProv = provAgg.length ? provAgg[0].gasto : 1;

    var alertas = prodAgg.filter(function(p){ return p.variacion!=null && Math.abs(p.variacion) >= 15; }).length;

    prodAgg.forEach(function(p){ p.pctTotal = totalGasto ? (p.gasto / totalGasto * 100) : 0; });

    var html = "";

    html += '<section class="kpis">';
    html += kpi(fmtMoney.format(totalGasto), "Gasto total");
    html += kpi(provAgg.length, "Proveedores activos");
    html += kpi(numFacturas, "Facturas");
    html += kpi(prodAgg.length, "Insumos distintos");
    html += kpi(alertas, "Variaciones de precio ≥15%");
    html += '</section>';

    html += '<section class="panel"><h2>Gasto por proveedor</h2>';
    provAgg.forEach(function(p){
      var pct = maxProv ? (p.gasto / maxProv * 100) : 0;
      html += '<div class="bar-row">';
      html += '<div class="prov" title="'+esc(p.proveedor)+'">'+esc(p.proveedor)+'</div>';
      html += '<div class="bar-track"><div class="bar-fill" style="width:'+pct.toFixed(1)+'%"></div></div>';
      html += '<div class="amt num">'+fmtMoney.format(p.gasto)+'</div>';
      html += '</div>';
    });
    html += '</section>';

    html += '<section class="panel"><h2>Ranking de insumos</h2>';
    html += '<div class="tablewrap"><table><thead><tr>';
    html += th("Insumo", "insumo");
    html += th("Proveedor", "proveedor");
    html += th("Volumen", "cantidad", true);
    html += th("Último precio", "ultimoPrecio", true);
    html += th("Precio anterior", "precioAnterior", true);
    html += th("Fecha precio anterior", "fechaAnterior", true);
    html += th("Variación", "variacion", true);
    html += th("Gasto total", "gasto", true);
    html += th("% sobre el total", "pctTotal", true);
    html += '</tr></thead><tbody>';

    var sorted = prodAgg.slice().sort(function(a,b){
      var ka = state.sortKey==="insumo" ? (a.descripcion||"") : (state.sortKey==="proveedor" ? (a.proveedor||"") : a[state.sortKey]);
      var kb = state.sortKey==="insumo" ? (b.descripcion||"") : (state.sortKey==="proveedor" ? (b.proveedor||"") : b[state.sortKey]);
      if(state.sortKey==="variacion"){ ka = ka==null?-Infinity:Math.abs(ka); kb = kb==null?-Infinity:Math.abs(kb); }
      else if(state.sortKey==="fechaAnterior"){ ka = ka?new Date(ka).getTime():-Infinity; kb = kb?new Date(kb).getTime():-Infinity; }
      if(typeof ka === "string"){ var c = ka.localeCompare(kb); return state.sortDir==="asc"?c:-c; }
      ka = ka==null?-Infinity:ka; kb = kb==null?-Infinity:kb;
      return state.sortDir==="asc" ? (ka-kb) : (kb-ka);
    });

    sorted.forEach(function(p){
      html += '<tr class="prod" data-key="'+esc(p.key)+'">';
      html += '<td>'+esc(p.descripcion)+'</td>';
      html += '<td>'+esc(p.proveedor)+'</td>';
      html += '<td class="num">'+fmtNum.format(p.cantidad)+' '+esc(p.unidad)+'</td>';
      html += '<td class="num">'+(p.ultimoPrecio!=null?fmtMoney.format(p.ultimoPrecio):"—")+'</td>';
      html += '<td class="num">'+(p.precioAnterior!=null?fmtMoney.format(p.precioAnterior):"—")+'</td>';
      html += '<td class="num">'+(p.fechaAnterior?fmtDate(p.fechaAnterior):"—")+'</td>';
      html += '<td class="num">'+variacionPill(p.variacion)+'</td>';
      html += '<td class="num">'+fmtMoney.format(p.gasto)+'</td>';
      html += '<td class="num">'+fmtNum.format(p.pctTotal)+'%</td>';
      html += '</tr>';
      if(state.openKey === p.key){
        html += '<tr class="detail"><td colspan="9">'+detailRow(p)+'</td></tr>';
      }
    });
    html += '</tbody></table></div></section>';

    app.innerHTML = html;

    $all("thead th[data-key]").forEach(function(th){
      th.classList.toggle("active", th.getAttribute("data-key")===state.sortKey);
      th.addEventListener("click", function(){
        var k = th.getAttribute("data-key");
        if(state.sortKey===k){ state.sortDir = state.sortDir==="asc"?"desc":"asc"; }
        else { state.sortKey = k; state.sortDir = "desc"; }
        render();
      });
    });

    $all("tr.prod").forEach(function(tr){
      tr.addEventListener("click", function(){
        var k = tr.getAttribute("data-key");
        state.openKey = (state.openKey===k) ? null : k;
        render();
      });
    });

    var foot = $("#footerNote");
    foot.hidden = false;
    foot.textContent = state.generado ? ("Datos actualizados: " + new Date(state.generado).toLocaleString("es-AR")) : "";
  }

  function kpi(v, l){
    return '<div class="kpi"><div class="v num">'+v+'</div><div class="l">'+esc(l)+'</div></div>';
  }
  function th(label, key, isNum){
    return '<th data-key="'+key+'"'+(isNum?' class="num"':'')+'>'+esc(label)+'</th>';
  }
  function variacionPill(v){
    if(v==null) return '<span class="pill flat">—</span>';
    var cls = v>0 ? "up" : (v<0 ? "down" : "flat");
    var big = Math.abs(v)>=15 ? " big" : "";
    var arrow = v>0 ? "▲" : (v<0 ? "▼" : "→");
    return '<span class="pill '+cls+big+'">'+arrow+' '+fmtPct(v)+'</span>';
  }

  function detailRow(p){
    var w = 320, h = 90, pad = 10;
    var vals = p.compras.map(function(c){ return c.precio_unitario||0; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min===max){ min = min - (min*0.1||1); max = max + (max*0.1||1); }
    var n = vals.length;
    var pts = vals.map(function(v,i){
      var x = n>1 ? pad + (w-2*pad) * (i/(n-1)) : w/2;
      var y = pad + (h-2*pad) * (1 - (v-min)/(max-min));
      return [x,y];
    });
    var poly = pts.map(function(pt){ return pt[0].toFixed(1)+","+pt[1].toFixed(1); }).join(" ");
    var dots = pts.map(function(pt,i){
      var r = i===pts.length-1 ? 4 : 2.5;
      var col = i===pts.length-1 ? "var(--accent)" : "var(--ink-dim)";
      return '<circle cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="'+r+'" fill="'+col+'"/>';
    }).join("");

    var svg = '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'
      + '<polyline points="'+poly+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'
      + dots + '</svg>';

    var list = '<table class="hist-list"><tbody>';
    p.compras.slice().reverse().forEach(function(c){
      list += '<tr><td>'+fmtDate(c.fecha)+'</td><td>'+esc(c.comprobante_nro||"")+'</td>'
        + '<td class="num">'+fmtNum.format(c.cantidad_comprada)+' '+esc(c.unidad_compra||"")+'</td>'
        + '<td class="num">'+fmtMoney.format(c.precio_unitario)+'</td>'
        + '<td class="num">'+fmtMoney.format(c.total)+'</td></tr>';
    });
    list += '</tbody></table>';

    return '<div class="hist">'+svg+list+'</div>';
  }

})();
</script>
</body>
</html>
